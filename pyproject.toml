[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-os"
version = "0.1.0"
description = "Finance and project-accounting platform for the fictional Echo Labs: generator, ingestion, reports."
requires-python = ">=3.11"
dependencies = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.6",
    "PyYAML==6.0.3",
    "reportlab==4.2.5",
    "pypdf==5.1.0",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finance_os.generator" = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
