version: 2

sources:
  - name: payroll
    schema: "{{ var('dataset_prefix', '') }}raw_payroll"
    description: Synthetic payroll provider export.
    loaded_at_field: _loaded_at
    tables:
      - name: employees
      - name: pay_runs
      - name: pay_lines
      - name: pay_register_lines
        description: Line-item payroll register (earnings, employee and employer taxes, deductions, benefits, net pay).
