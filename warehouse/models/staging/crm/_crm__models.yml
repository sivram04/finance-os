version: 2

models:
  - name: stg_crm__opportunities
    description: One row per CRM opportunity (won, lost or open), sized in ARR.
    columns:
      - name: opportunity_id
        data_tests: [unique, not_null]
      - name: stage
        data_tests:
          - accepted_values:
              arguments: {values: [discovery, evaluation, proposal, negotiation, closed_won, closed_lost]}
      - name: customer_id
        data_tests:
          - relationships:
              arguments: {to: ref('dim_customer'), field: customer_id}

  - name: stg_crm__contracts
    description: One row per committed-use customer contract (renewals are new rows pointing at the contract they renew).
    columns:
      - name: contract_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: [active, renewed, terminated]}

  - name: stg_crm__contract_schedule
    description: Commitment by contract year.
