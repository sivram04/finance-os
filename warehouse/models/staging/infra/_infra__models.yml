version: 2

models:
  - name: stg_infra__gpu_jobs
    description: "Grain: one row per GPU job. customer_id is null for shared idle/warm-pool jobs."
    columns:
      - name: job_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_synthetic__products'), field: product_id}
      - name: customer_id
        data_tests:
          - relationships:
              arguments: {to: ref('stg_synthetic__customers'), field: customer_id}
      - name: gpu_type
        data_tests:
          - accepted_values:
              arguments: {values: [L4, A100, H100]}
      - name: gpu_seconds
        data_tests: [not_null]

  - name: stg_infra__cloud_costs_daily
    description: "Grain: one row per day × service × sku × labels."
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments: {columns: [usage_date, service, sku, label_team, label_env]}
    columns:
      - name: cost
        data_tests: [not_null]
      - name: is_tagged
        data_tests: [not_null]
