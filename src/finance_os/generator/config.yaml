# Echo Labs synthetic company. Design doc §3.
seed: 20250101
window:
  start: 2025-01-01
  end: 2026-09-30

products:
  - {product_id: batch_base,  model: echo-base,   workload: batch,     list_price_per_hour: "0.15"}
  - {product_id: batch_pro,   model: echo-pro,    workload: batch,     list_price_per_hour: "0.37"}
  - {product_id: stream,      model: echo-stream, workload: streaming, list_price_per_hour: "0.47"}

# Monthly volume tiers, applied to a customer's total hours in a month.
volume_tiers:
  - {min_hours_month: 0,      discount_pct: "0.00"}
  - {min_hours_month: 10000,  discount_pct: "0.10"}
  - {min_hours_month: 100000, discount_pct: "0.20"}

# Scale profiles (python -m finance_os.generator --scale S|M|L). S is the default: the local DuckDB build, tests
# and every planted anomaly are calibrated to it. L is the BigQuery scale run (~300M+ API requests).
scales:
  S: {self_serve: 90,   mid_market: 11,  enterprise: 4}
  M: {self_serve: 300,  mid_market: 80,  enterprise: 20}
  L: {self_serve: 1500, mid_market: 400, enterprise: 100}
# Headcount (and the opex that grows with it) per scale: a 2,000-customer company is not run by 49 people.
people_scale: {S: 1, M: 3, L: 10}

# Request-level API usage (raw_usage.api_requests), expanded from the daily drivers by SQL in the warehouse
# (finance_os.generator.high_volume). Each day's requests split the day's audio exactly, so the warehouse can
# reconcile events back to the drivers to the millisecond.
api_requests:
  avg_request_seconds: {batch: 2400, streaming: 900}   # average audio per request (40 min files, 15 min sessions)
  duration_jitter: "0.6"           # paired ± variation around the average, so totals stay exact
  failed_request_rate: "0.015"     # extra 4xx/5xx requests (not billable, no audio)
  duplicate_rate: "0.001"          # events delivered twice (same request_id, later ingested_at)
  late_rate: "0.005"               # events ingested 1-5 days after they happened
  schema_v2_from: 2026-03-01       # logging change: duration moves from audio_duration_ms (int) to audio_seconds (float)
  regions: [us-east1, us-west1, europe-west1]

# Starting monthly audio hours per customer (range), and monthly growth (range).
segments:
  self_serve:  {count: 90, start_hours: [90, 1800],       growth: ["0.00", "0.08"]}
  mid_market:  {count: 11, start_hours: [9000, 45000],    growth: ["0.02", "0.07"]}
  enterprise:  {count: 4,  start_hours: [220000, 630000], growth: ["0.02", "0.05"]}

# --- Customer lifecycle (raw_synth.lifecycle_events). What an AI API business lives with. ---
# Random monthly events per customer after signup. Multipliers scale usage from the event date on.
lifecycle:
  churn_prob_monthly:   {self_serve: "0.025", mid_market: "0.006", enterprise: "0"}
  involuntary_share:    {self_serve: "0.35",  mid_market: "0.10",  enterprise: "0"}   # payment failed, not a decision
  reactivation_prob: "0.30"          # share of involuntary churners who come back (win-back)
  reactivation_months: [1, 3]
  expansion_prob_monthly:   {self_serve: "0.010", mid_market: "0.020", enterprise: "0"}
  expansion_multiplier: ["1.30", "2.00"]
  contraction_prob_monthly: {self_serve: "0.010", mid_market: "0.012", enterprise: "0"}
  contraction_multiplier: ["0.50", "0.80"]

# Named situations, applied on top of the random events.
scripted_events:
  - {customer_id: EN-004, date: 2025-09-01, event_type: expansion,   multiplier: "1.60", reason: new_use_case}
  - {customer_id: EN-003, date: 2026-03-01, event_type: contraction, multiplier: "0.70", reason: competitor_evaluation}
  - {customer_id: EN-003, date: 2026-05-01, event_type: contraction, multiplier: "0.55", reason: competitor_migration}
  - {customer_id: EN-003, date: 2026-06-15, event_type: churn,       multiplier: "0",    reason: competitor_switch}
  - {customer_id: MM-003, date: 2025-11-01, event_type: spike,       multiplier: "5.00", reason: archive_backfill}
# Market-wide events: apply to every customer in the segment whose base-model share is at least min_base_share.
market_events:
  - {date: 2026-04-01, segment: mid_market, min_base_share: "0.30", event_type: contraction, multiplier: "0.75", reason: competitor_price_cut}

# --- Infra (raw_infra). Design doc §7.1, §7.6 ---
# GPU seconds per audio hour and GPU type per model. Rates live in warehouse/seeds/gpu_rates.csv.
gpu_profile:
  echo-base:   {gpu_type: L4,   seconds_per_hour: 55}
  echo-pro:    {gpu_type: A100, seconds_per_hour: 85}
  echo-stream: {gpu_type: H100, seconds_per_hour: 95}
shared_gpu_pct: "0.12"          # idle / warm-pool seconds, as a share of direct seconds per model per day
requests_per_hour:              # API requests per audio hour (drives overhead allocation)
  batch: [3, 5]
  streaming: [1, 3]
region: us-central1

# Daily cloud overhead lines: fixed $/day + $ per audio hour served that day. team/env null = untagged.
cloud_overhead:
  - {service: Cloud Storage, sku: Standard Storage,   team: infra, env: prod, fixed: "18.00", per_hour: "0.0012"}
  - {service: Networking,    sku: Egress Internet,    team: infra, env: prod, fixed: "6.00",  per_hour: "0.0009"}
  - {service: Cloud Logging, sku: Log Volume,         team: infra, env: prod, fixed: "4.00",  per_hour: "0.0003"}
  - {service: Compute Engine, sku: N2 Instance Core,  team: eng,   env: dev,  fixed: "22.00", per_hour: "0"}
  - {service: Compute Engine, sku: E2 Instance Core,  team: null,  env: null, fixed: "9.00",  per_hour: "0.0002"}

# --- People (raw_payroll). Headcount grows linearly from start to end count over the window. ---
# Support and success payroll feed the M2 contribution-margin pools.
headcount_plan:
  - {department: ENG, function: engineering,          title: Software Engineer,       start: 14, end: 20, salary: [175000, 235000]}
  - {department: INF, function: infrastructure,       title: Infrastructure Engineer, start: 4,  end: 6,  salary: [185000, 240000]}
  - {department: SAL, function: sales,                title: Account Executive,       start: 4,  end: 7,  salary: [120000, 160000]}
  - {department: SAL, function: success,              title: Customer Success Manager, start: 2, end: 4,  salary: [105000, 135000]}
  - {department: PS,  function: professional_services, title: Solutions Engineer,     start: 3,  end: 4,  salary: [140000, 180000]}
  - {department: PS,  function: support,              title: Support Engineer,        start: 2,  end: 3,  salary: [85000, 110000]}
  - {department: GA,  function: g_and_a,              title: G&A,                     start: 4,  end: 5,  salary: [130000, 260000]}
terminations: 3                     # random leavers over the window, replaced by the hiring plan
payroll:   # rates, wage bases and benefits live in generator/events/payroll.py (line-item register)
  employer_tax_pct: "0.0765"     # planning rate only (labor cost policy); the register computes actual taxes
  benefits_per_month: "950.00"

# --- Ledger (raw_erp). ---
funding:
  - {date: 2025-01-02, amount: "18000000.00", memo: Series A}
collections_days:                   # days from invoice to cash, [min, max], by segment
  self_serve: [1, 3]
  mid_market: [25, 50]
  enterprise: [30, 65]
vendor_payment_days: 30
# Non-payroll operating spend paid monthly, $ at start; grows with headcount.
opex_monthly:
  - {account: "6200", department: ENG, memo: Engineering software and SaaS, amount: "9000.00"}
  - {account: "6200", department: GA,  memo: G&A software and SaaS,         amount: "4000.00"}
  - {account: "6300", department: GA,  memo: Rent and facilities,           amount: "26000.00"}
  - {account: "6400", department: GA,  memo: Legal and accounting,          amount: "14000.00"}
  - {account: "6500", department: SAL, memo: Marketing and travel,          amount: "22000.00"}

# --- Injected anomalies (FR-1.4). Each must be caught by a test. ---
anomalies:
  - anomaly_id: A-M2-01
    module: M2
    kind: streaming_shift
    customer_id: EN-002
    start: 2026-02-01
    mix: {batch_pro: "0.20", stream: "0.80"}
    gpu_seconds_multiplier: "3.4"   # low-concurrency real-time sessions
    description: Enterprise customer moves most volume to streaming with low GPU utilization; gross margin falls below the floor.
    expected_detection: fct_customer_margin_monthly.is_below_floor = true for EN-002 from 2026-02
  - anomaly_id: A-M3-01
    module: M3
    kind: untagged_gpu_cluster
    entity_id: gpu-cluster-a100-scratch
    start: 2026-05-11
    days: 9
    service: Compute Engine
    sku: A100 80GB GPU running in Americas
    daily_cost: "460.80"            # 8 × A100 × 24 h × $2.40
    description: A GPU cluster left running without labels for 9 days (untagged spike).
    expected_detection: fct_untagged_spend_daily.is_spike = true on each of the 9 days

  - anomaly_id: A-M4-01
    module: M4
    kind: enterprise_churn
    entity_id: EN-003
    start: 2026-03-01
    description: Enterprise customer evaluates a competitor, ramps down over 3 months and churns mid-June 2026.
    expected_detection: fct_customer_revenue_monthly shows contraction from 2026-03 and churn in 2026-07
  - anomaly_id: A-M5-01
    module: M5
    kind: unbudgeted_expense
    entity_id: GA-6400
    start: 2026-03-01
    description: Outside counsel for a customer contract dispute, unbudgeted, Mar–May 2026 in G&A professional fees.
    expected_detection: fct_bva_alerts has a GA / 6400 overspend alert in each of 2026-03, 2026-04, 2026-05
  - anomaly_id: A-M6-01
    module: M6
    kind: project_over_budget
    entity_id: P-103
    start: 2026-01-01
    description: Fixed-fee project overruns; EAC reaches 118% of budget.
    expected_detection: fct_project_financials.eac_pct_of_budget >= 1.15 for P-103 by the last month
  - anomaly_id: A-M6-02
    module: M6
    kind: tm_cap_threshold
    entity_id: P-102
    start: 2026-01-01
    description: T&M with cap; billed reaches 88% of the cap.
    expected_detection: fct_project_financials.is_cap_alert = true for P-102 by the last month
  - anomaly_id: A-M6-03
    module: M6
    kind: funding_threshold
    entity_id: C-105
    start: 2026-01-01
    description: Federal T&M contract; billed + unbilled passes 75% of funded (Limitation of Funds notice).
    expected_detection: fct_contract_funding.is_funding_alert_75 = true for C-105 by the last month
  - anomaly_id: A-M6-04
    module: M6
    kind: bill_without_po
    entity_id: P-103
    start: 2026-02-18
    description: Subcontractor bill posted with no purchase order.
    expected_detection: fct_project_exceptions has a bill_without_po row for P-103
  - anomaly_id: A-M6-05
    module: M7
    kind: unbilled_milestone
    entity_id: P-106
    start: 2026-07-15
    description: Milestone accepted but never invoiced; shows as unbilled WIP.
    expected_detection: fct_project_financials.unbilled > 0 for P-106 at the last month
  - anomaly_id: A-M7-01
    module: M7
    kind: wrong_bill_rate
    entity_id: P-102
    start: 2026-03-01
    description: A T&M invoice line billed at the Senior ML Engineer rate for ML Engineer hours.
    expected_detection: fct_billing_exceptions has a rate_mismatch for P-102, service month 2026-03
  - anomaly_id: A-AP-01
    module: AP
    kind: ap_arithmetic_error
    entity_id: annotate_co
    start: 2025-10-01
    description: Vendor PDF total is $100 more than the sum of its lines.
    expected_detection: fct_ap_review_queue has an arithmetic_mismatch for this document
  - anomaly_id: A-AP-02
    module: AP
    kind: ap_duplicate_submission
    entity_id: fedsec
    start: 2026-01-01
    description: The same vendor invoice is emailed twice.
    expected_detection: fct_ap_review_queue has a duplicate_invoice for the second copy
  - anomaly_id: A-AP-03
    module: AP
    kind: ap_wrong_po
    entity_id: fedsec
    start: 2026-04-01
    description: Vendor cites another vendor's PO number on the bill.
    expected_detection: fct_ap_review_queue has a po_vendor_mismatch for this document
  - anomaly_id: A-M8-01
    module: M8
    kind: slow_payer
    entity_id: MM-001
    start: 2025-04-01
    description: Mid-market customer pays project invoices 70-95 days after invoice on net-30 terms.
    expected_detection: fct_customer_payment_behavior.is_chronic_late = true for MM-001
  - anomaly_id: A-M8-02
    module: M8
    kind: misapplied_payment
    entity_id: EN-001
    start: 2026-06-01
    description: EN-001's payment for its June 2026 invoice is applied to the May invoice (already paid).
    expected_detection: fct_cash_application_exceptions has a remittance_mismatch and an overapplied invoice for EN-001
  - anomaly_id: A-M4-02
    module: M4
    kind: usage_spike
    entity_id: MM-003
    start: 2025-11-01
    description: One-off archive backfill at 5x normal volume in Nov 2025 inflates the usage run-rate (ARR).
    expected_detection: fct_customer_revenue_monthly.is_usage_spike = true for MM-003 in 2025-11

# --- Budgets (raw_erp.budgets, M5). Built from the plan, never from actuals of the budgeted year. ---
budget:
  fy2025:
    revenue_start: "650000.00"        # January 2025 plan (about the December 2024 run rate plus new logos)
    revenue_growth: "0.045"           # monthly
    gross_margin_pct: "0.60"
  fy2026:
    revenue_base_month: 2025-10-01    # planned in Q4 2025 from the October run-rate
    revenue_growth: "0.050"           # optimistic: the plan assumed no big churn and no price war
    gross_margin_pct: "0.55"
  cogs_split: {"5000": "0.92", "5010": "0.05", "5100": "0.03"}
  rd_cloud_monthly: {fy2025: "900.00", fy2026: "1000.00"}

# One-off expenses posted to the GL (paid by cash on the date).
one_off_expenses:
  - {date: 2026-03-20, account: "6400", department: GA, amount: "45000.00", memo: Outside counsel - customer contract dispute}
  - {date: 2026-04-18, account: "6400", department: GA, amount: "32000.00", memo: Outside counsel - customer contract dispute}
  - {date: 2026-05-22, account: "6400", department: GA, amount: "26000.00", memo: Outside counsel - settlement review}

# Fixed assets bought for cash (Dr 1500 / Cr cash) and depreciated straight-line from the month after purchase
# (Dr 6600 depreciation / Cr 1510 accumulated depreciation), at month end, until fully depreciated.
capex:
  - {date: 2025-01-15, account_class: it_equipment, department: GA,  amount: "180000.00", life_months: 36, memo: Laptops and office IT}
  - {date: 2025-06-10, account_class: servers,      department: INF, amount: "1200000.00", life_months: 48, memo: Inference servers (colocation)}
  - {date: 2025-11-05, account_class: leasehold,    department: GA,  amount: "350000.00", life_months: 60, memo: Office build-out}
  - {date: 2026-04-12, account_class: servers,      department: INF, amount: "900000.00", life_months: 48, memo: Inference servers, second rack}
  - {date: 2026-08-20, account_class: it_equipment, department: GA,  amount: "90000.00",  life_months: 36, memo: Laptops for new hires}

# --- Projects (raw_projects, M6). Implementation work for enterprise and federal customers. ---
# Labor category by employee title; bill rates are per contract.
labor_category_by_title:
  Software Engineer: Senior ML Engineer
  Solutions Engineer: ML Engineer
  Infrastructure Engineer: Data Engineer
labor_cost_policy: {standard_hours_year: 2080}   # loaded cost rate = (salary × (1 + tax) + benefits × 12) / hours
subcontractors:
  - {vendor_id: annotate_co, vendor_name: Annotate Co (data labeling)}
  - {vendor_id: fedsec, vendor_name: FedSec Partners (compliance)}
projects:
  - project_id: P-101
    name: Enterprise A - custom vocabulary model
    customer_id: EN-001
    contract: {contract_id: C-101, type: fixed_fee, value: "180000.00", payment_terms_days: 30}
    start: 2025-02-01
    end: 2025-11-30
    budget: {labor: "95000.00", subcontractor: "20000.00", odc: "5000.00"}
    milestones:
      - {name: Discovery and data audit, amount: "36000.00", accept: 2025-03-28}
      - {name: Model v1,                amount: "54000.00", accept: 2025-06-27}
      - {name: Integration,             amount: "54000.00", accept: 2025-09-26}
      - {name: Production go-live,      amount: "36000.00", accept: 2025-11-21}
    pos: [{vendor_id: annotate_co, amount: "20000.00", date: 2025-02-15, description: Transcript labeling}]
    cost_overrun: "1.02"
    team: {ML Engineer: 2, Senior ML Engineer: 1}
  - project_id: P-102
    name: Enterprise B - streaming diarization
    customer_id: EN-002
    contract: {contract_id: C-102, type: tm_cap, value: "120000.00", cap: "120000.00", payment_terms_days: 30}
    start: 2025-06-01
    end: 2026-10-31
    budget: {labor: "80000.00", odc: "4000.00"}
    rates: {Senior ML Engineer: "215.00", ML Engineer: "170.00", Data Engineer: "160.00"}
    billed_target: "105600.00"          # 88% of cap by the end of data
    team: {ML Engineer: 1, Senior ML Engineer: 1}
  - project_id: P-103
    name: Enterprise C - medical terminology model
    customer_id: EN-004
    contract: {contract_id: C-103, type: fixed_fee, value: "95000.00", payment_terms_days: 30}
    start: 2025-09-01
    end: 2026-06-30
    budget: {labor: "55000.00", subcontractor: "10000.00", odc: "3000.00"}
    milestones:
      - {name: Data pipeline,  amount: "28500.00", accept: 2025-12-12}
      - {name: Model v1,       amount: "38000.00", accept: 2026-04-24}
      - {name: Final delivery, amount: "28500.00", accept: null}
    pos: [{vendor_id: annotate_co, amount: "10000.00", date: 2025-09-10, description: Medical transcript labeling}]
    cost_overrun: "1.18"                # EAC ends at 118% of budget
    end_actual: 2026-10-31              # slips past plan
    team: {ML Engineer: 1, Senior ML Engineer: 2}
  - project_id: P-104
    name: Mid-market D - call analytics integration
    customer_id: MM-001
    contract: {contract_id: C-104, type: tm, value: "60000.00", payment_terms_days: 30}
    start: 2025-04-01
    end: 2025-12-31
    budget: {labor: "38000.00", odc: "1500.00"}
    rates: {Senior ML Engineer: "200.00", ML Engineer: "160.00", Data Engineer: "150.00"}
    billed_target: "58000.00"
    collection_days: [72, 95]           # slow payer (M8)
    team: {ML Engineer: 1, Data Engineer: 1}
  - project_id: P-105
    name: Federal agency - secure on-prem transcription
    customer_id: FED-001
    contract:
      contract_id: C-105
      type: federal_tm
      value: "450000.00"
      ceiling: "450000.00"
      funded: "300000.00"
      payment_terms_days: 30
      clins:
        - {clin_id: "0001", description: Labor, ceiling: "400000.00", funded: "270000.00"}
        - {clin_id: "0002", description: Other direct costs, ceiling: "50000.00", funded: "30000.00"}
    start: 2025-07-01
    end: 2026-12-31
    budget: {labor: "260000.00", subcontractor: "40000.00", odc: "20000.00"}
    rates: {Senior ML Engineer: "210.00", ML Engineer: "165.00", Data Engineer: "150.00"}
    billed_target: "232000.00"          # labor + ODC billed and unbilled ≈ 77% of funded by the end of data
    pos: [{vendor_id: fedsec, amount: "40000.00", date: 2025-07-15, description: FedRAMP compliance support}]
    team: {ML Engineer: 2, Senior ML Engineer: 1, Data Engineer: 1}
  - project_id: P-106
    name: Enterprise A - multilingual expansion
    customer_id: EN-001
    contract: {contract_id: C-106, type: fixed_fee, value: "70000.00", payment_terms_days: 30}
    start: 2026-04-01
    end: 2026-11-30
    budget: {labor: "42000.00", odc: "2000.00"}
    milestones:
      - {name: Language pack 1, amount: "35000.00", accept: 2026-07-15, bill: false}   # accepted, never billed
      - {name: Language pack 2, amount: "35000.00", accept: null}
    team: {ML Engineer: 1, Senior ML Engineer: 1}
# Billing errors the pre-bill validator must catch (M7).
billing_errors:
  - {project_id: P-102, service_month: 2026-03-01, labor_category: ML Engineer, billed_rate: "215.00"}   # contract rate 170
# A subcontractor bill posted with no purchase order.
bills_without_po:
  - {project_id: P-103, vendor_id: annotate_co, date: 2026-02-18, amount: "8500.00", description: Rush relabeling (no PO)}

# --- AR and collections (M8). ---
ar:
  misapplied_payments:   # customer pays one invoice; AR applies the cash to another
    - {customer_id: EN-001, remittance_month: 2026-06-01}               # applied to the prior month's invoice
  disputes:              # customer withholds payment pending a dispute
    - {project_id: P-102, service_month: 2026-03-01, opened: 2026-04-20, root_cause: billing_rate_error,
       note: "Customer disputes the ML Engineer rate billed on the March invoice (215/h vs 170/h contract)"}

# --- Stripe (raw_stripe): the billing system for usage invoices. Objects follow Stripe's API shape. ---
stripe:
  refund_rate: "0.006"        # share of paid self-serve invoices refunded in full
  refund_days: [3, 20]        # days after payment
  payout_delay_days: 2        # balance becomes available (and is paid out) this many days after the charge
  failed_attempts: 3          # failed card attempts before an invoice is marked uncollectible

# --- AP document intake (data/inbox/ap). Vendors send PDF bills; each vendor has its own layout. ---
ap_documents:
  layouts:   # how each vendor prints its bill (labels differ, as real vendors do)
    nimbus:      {name: "Nimbus GPU Cloud, Inc.", prefix: NGC, number_label: "Invoice #",   total_label: "Amount Due",  date_label: "Invoice Date", po_label: "PO"}
    gcp:         {name: "Google Cloud",           prefix: GCP, number_label: "Invoice number", total_label: "Total",    date_label: "Issue date",   po_label: "PO"}
    annotate_co: {name: "Annotate Co",            prefix: AC,  number_label: "Bill No.",    total_label: "Total Due",   date_label: "Date",         po_label: "Purchase Order"}
    fedsec:      {name: "FedSec Partners LLC",    prefix: FSP, number_label: "Invoice No",  total_label: "Balance Due", date_label: "Dated",        po_label: "Customer PO"}
    # vendors that only appear in the live simulation (one-off bills; not in the vendor master, so intake flags them)
    lexpoint:    {name: "Lexpoint LLP",           prefix: LXP, number_label: "Invoice No",  total_label: "Balance Due", date_label: "Dated",        po_label: "Customer PO"}
    northwind:   {name: "Northwind Advisory",     prefix: NWA, number_label: "Invoice #",   total_label: "Amount Due",  date_label: "Invoice Date", po_label: "PO"}
    brightstack: {name: "BrightStack Software",   prefix: BSS, number_label: "Invoice number", total_label: "Total",    date_label: "Issue date",   po_label: "PO"}
    adhaven:     {name: "AdHaven Media",          prefix: ADH, number_label: "Bill No.",    total_label: "Total Due",   date_label: "Date",         po_label: "Purchase Order"}
  issues:    # problems in the documents themselves; intake must route each to review
    - {kind: arithmetic_error,     vendor_id: annotate_co, service_month: 2025-10-01, project_id: P-101, total_delta: "100.00"}
    - {kind: duplicate_submission, vendor_id: fedsec,      service_month: 2026-01-01}
    - {kind: wrong_po,             vendor_id: fedsec,      service_month: 2026-04-01, printed_po: PO00001}

# --- Vendor billing (raw_erp). Rates and contracts are read from warehouse/seeds. ---
vendor_billing:
  metering_noise_pct: "0.004"       # vendor-metered vs. our job logs, per month (±)
  bill_day: 5                       # invoice dated the 5th of the following month
