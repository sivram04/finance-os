[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-os"
version = "0.1.0"
description = "Finance and project-accounting platform for the fictional Echo Labs: generator, ingestion, reports."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "dbt-core==1.12.6",
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.6",
    "PyYAML==6.0.3",
    "reportlab==4.2.5",
    "pypdf==5.1.0",
    "fastapi==0.143.3",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "statsmodels==0.15.0",
    "google-auth==2.62.0",
    "pyarrow==26.0.0",
    "scipy==1.18.1",
    "formulas==1.3.4",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"finance_os.generator" = ["config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
