# Metric catalog (design §7.5, FR-4.5, NFR-10). Source of truth for every KPI in fct_kpi_monthly.
# After editing, run: python -m finance_os.reports.build_metric_catalog
# status: MEASURED (from source data) or ASSUMED (depends on a modeled input).
# threshold: basis (value | mom | vs_budget | vs_plan | vs_run_rate), better (higher | lower), amber and red boundaries;
# decision_amber / decision_red: what happens when the metric crosses them. recon_checks: the checks that prove it.
metrics:
- name: revenue
  label: Revenue
  unit: usd
  purpose: Top-line growth tracking and the base for every margin.
  formula: Sum of GL revenue recognized in the month (usage 4000 + project services 4100).
  grain: month
  source_model: fct_gl_monthly
  owner: Controller
  status: MEASURED
  tolerance: Usage must equal rated usage (recon_gl_revenue); services must equal project invoices (recon_project_billing_gl).
  numerator: GL revenue accounts 4000 + 4010 + 4100
  denominator: n/a
  inclusions: Usage, refunds and credits, project services
  exclusions: Intercompany service revenue (4900, eliminated)
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: vs_budget
    better: higher
    amber: -0.05
    red: -0.15
  recon_checks:
  - gl_revenue_vs_rated_usage
  - stripe_invoices_vs_gl_revenue
  - project_billing_vs_gl
  decision_amber: VP Finance explains the gap and re-forecasts the year
  decision_red: 'CFO decides: accept and re-forecast, fund a corrective plan, or cut spend'
- name: cogs
  label: Cost of revenue
  unit: usd
  purpose: Gross margin and cost-to-serve trend.
  formula: Sum of GL COGS accounts (5000 GPU, 5010 cloud hosting, 5100 payment processing, 5200/5210 project subcontractors and direct costs).
  grain: month
  source_model: fct_gl_monthly
  owner: Controller
  status: MEASURED
  tolerance: Vendor invoices reconcile to modeled cost within 1% (recon_vendor_invoices).
  numerator: GL COGS accounts 5000-5210
  denominator: n/a
  inclusions: GPU, cloud hosting, payment processing, project subcontractors and direct costs
  exclusions: Depreciation (opex)
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: vs_budget
    better: lower
    amber: -0.05
    red: -0.15
  recon_checks:
  - vendor_invoice_vs_modeled
  - vendor_bill_vs_gl_ap
  - gcp_export_vs_bill
  decision_amber: Head of Infra explains cost per hour vs plan
  decision_red: CFO approves a cost-to-serve plan (commit renegotiation, routing, idle-pool cut)
- name: opex
  label: Operating expenses
  unit: usd
  purpose: Spending pace by department; input to BvA (M5).
  formula: Sum of GL operating expense accounts (6000–6500).
  grain: month
  source_model: fct_gl_monthly
  owner: Controller
  status: MEASURED
  tolerance: Payroll accounts equal the payroll register exactly (recon_payroll_gl).
  numerator: GL opex accounts 6000-6600
  denominator: n/a
  inclusions: Payroll, cloud R&D, software, rent, professional fees, marketing, depreciation
  exclusions: Intercompany service fees (6900, eliminated)
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: vs_budget
    better: lower
    amber: -0.05
    red: -0.1
  recon_checks:
  - payroll_register_vs_gl
  decision_amber: Department owners explain overspend in commentary
  decision_red: 'CFO decides: re-budget, freeze discretionary spend or approve the overrun'
- name: gross_margin_pct
  label: Gross margin %
  unit: ratio
  purpose: Pricing and product mix decisions.
  formula: (Revenue − COGS) ÷ Revenue, from the GL.
  grain: month
  source_model: fct_gl_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: GL-based; differs from fct_unit_economics_monthly, which allocates modeled cost and excludes payment fees.
  numerator: revenue - cogs
  denominator: revenue
  inclusions: As revenue and cogs
  exclusions: Depreciation
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: higher
    amber: 0.62
    red: 0.55
  recon_checks:
  - gl_revenue_vs_rated_usage
  - vendor_invoice_vs_modeled
  decision_amber: Review customers below the margin floor
  decision_red: Reprice below-floor customers and cut cost per hour; pause discounting
- name: gross_burn
  label: Gross burn
  unit: usd
  purpose: Spending pace in cash terms.
  formula: Operating cash out (GL cash account 1000, excluding financing).
  grain: month
  source_model: fct_cash_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: Closing cash must never be negative.
  numerator: Cash paid out in the month (credits to account 1000)
  denominator: n/a
  inclusions: Operating and capital payments
  exclusions: Intercompany settlements (net to zero across entities)
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: mom
    better: lower
    amber: 0.05
    red: 0.15
  recon_checks:
  - stripe_balance_vs_gl_cash
  - payroll_register_vs_gl
  decision_amber: Explain the step-up in spend
  decision_red: Spend review with each department head
- name: net_burn
  label: Net burn
  unit: usd
  purpose: How fast the company consumes cash; drives runway.
  formula: Operating cash out − operating cash in. Positive = burning.
  grain: month
  source_model: fct_cash_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: None beyond GL balance.
  numerator: Cash out - cash in, excluding equity raised
  denominator: n/a
  inclusions: Operations and capex
  exclusions: Funding rounds
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: mom
    better: lower
    amber: 0.1
    red: 0.3
  recon_checks:
  - stripe_balance_vs_gl_cash
  decision_amber: Explain the burn increase (burn bridge)
  decision_red: CFO sets a burn ceiling and reviews hiring
- name: closing_cash
  label: Cash balance
  unit: usd
  purpose: Liquidity and fundraising timing.
  formula: Cumulative net change in GL cash (account 1000) to month end.
  grain: month
  source_model: fct_cash_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: Will reconcile to Stripe payouts and bank statements in M12.
  numerator: Balance of account 1000 at month end, all entities
  denominator: n/a
  inclusions: Operating bank, money market, T-bills (one GL account)
  exclusions: None
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: higher
    amber: 9000000
    red: 6000000
  recon_checks:
  - stripe_balance_vs_gl_cash
  decision_amber: Re-run the 13-week cash forecast
  decision_red: Start the financing plan; draw the venture facility if needed
- name: runway_months
  label: Runway
  unit: months
  purpose: Fundraising timing.
  formula: Closing cash ÷ average net burn over the trailing 3 months. Blank when not burning or under 3 months of history.
  grain: month
  source_model: fct_cash_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: Assumes the trailing burn rate continues; not a forecast.
  numerator: closing_cash
  denominator: average net burn, trailing 3 months
  inclusions: As net burn
  exclusions: Planned raises (see the scenario engine for runway with financing)
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: higher
    amber: 24
    red: 15
  recon_checks:
  - stripe_balance_vs_gl_cash
  decision_amber: Board update on runway and the funding plan
  decision_red: Raise now or cut burn to reach 24 months
- name: arr
  label: Run-rate ARR
  unit: usd
  purpose: Growth tracking on an annualized basis.
  formula: Recognized usage revenue in the month x 12. A run rate, not contracted ARR (see contracted_arr) and not GAAP revenue.
  grain: month
  source_model: fct_gl_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: Usage-based ARR moves with seasonality; read with NRR.
  numerator: Recognized usage revenue in the month x 12
  denominator: n/a
  inclusions: Usage revenue (4000)
  exclusions: Project services, refunds
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 2
  effective_from: '2026-10-19'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: mom
    better: higher
    amber: 0.0
    red: -0.02
  recon_checks:
  - gl_revenue_vs_rated_usage
  decision_amber: Explain the ARR movement (ARR waterfall)
  decision_red: Retention and pipeline plan from the CRO
- name: headcount
  label: Headcount
  unit: count
  purpose: Hiring plan tracking and per-employee ratios.
  formula: Employees hired on or before month end and not yet terminated.
  grain: month
  source_model: fct_headcount_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: Employees with pay in the month must reconcile to headcount ± hires and leavers.
  numerator: Employees on payroll at month end, all entities
  denominator: n/a
  inclusions: Full-time employees
  exclusions: Contractors, planned hires
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: vs_plan
    better: lower
    amber: 0.02
    red: 0.05
  recon_checks:
  - payroll_register_vs_gl
  decision_amber: Reconcile hires to the approved plan
  decision_red: Freeze unapproved requisitions
- name: arr_per_employee
  label: ARR per employee
  unit: usd
  purpose: Efficiency benchmark (FR-4.3 revenue per employee, on an annualized basis).
  formula: ARR ÷ month-end headcount.
  grain: month
  source_model: fct_kpi_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: None.
  numerator: arr
  denominator: headcount
  inclusions: As arr and headcount
  exclusions: None
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: higher
    amber: 250000
    red: 180000
  recon_checks: []
  decision_amber: Check hiring is ahead of revenue
  decision_red: Slow hiring until ARR per employee recovers
- name: nrr
  label: Net revenue retention
  unit: ratio
  purpose: Expansion health of the existing customer base.
  formula: Trailing-3-month revenue now from customers who had revenue in the same window 12 months earlier ÷ their revenue then.
  grain: month
  source_model: fct_gl_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: Starts once 12 months plus a 3-month window of history exist.
  numerator: Revenue this month from customers active 12 months ago
  denominator: Their revenue 12 months ago
  inclusions: Expansion, contraction, churn
  exclusions: New customers
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: higher
    amber: 1.1
    red: 1.0
  recon_checks:
  - gl_revenue_vs_rated_usage
  decision_amber: Review contraction and churn drivers
  decision_red: Retention program and expansion targets for CS and Sales
- name: grr
  label: Gross revenue retention
  unit: ratio
  purpose: Churn and contraction, with expansion removed.
  formula: Same cohort as NRR, but each customer's current revenue is capped at its prior revenue.
  grain: month
  source_model: fct_gl_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: Always ≤ NRR and ≤ 1.
  numerator: Revenue this month from customers active 12 months ago, each capped at its revenue then
  denominator: Their revenue 12 months ago
  inclusions: Contraction and churn
  exclusions: Expansion, new customers
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: higher
    amber: 0.9
    red: 0.85
  recon_checks:
  - gl_revenue_vs_rated_usage
  decision_amber: Review accounts that contracted or churned
  decision_red: Save plan for at-risk accounts; review product fit
- name: active_customers
  label: Active customers
  unit: count
  purpose: Size of the paying base; denominator for churn.
  formula: Customers with usage revenue in the month.
  grain: month
  source_model: fct_mrr_bridge_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: Equals opening + new + reactivated − churned (assert_mrr_bridge_balances).
  numerator: Customers with revenue in the month
  denominator: n/a
  inclusions: All segments
  exclusions: None
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: mom
    better: higher
    amber: 0.0
    red: -0.03
  recon_checks: []
  decision_amber: Explain the drop
  decision_red: Acquisition and retention plan
- name: new_customers
  label: New customers
  unit: count
  purpose: Acquisition pace.
  formula: Customers with revenue this month and none in any earlier month.
  grain: month
  source_model: fct_mrr_bridge_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: None.
  numerator: Customers whose first revenue month is this month
  denominator: n/a
  inclusions: All segments
  exclusions: Reactivations
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: higher
    amber: 3
    red: 1
  recon_checks: []
  decision_amber: Check pipeline conversion
  decision_red: Marketing and sales capacity review
- name: churned_customers
  label: Churned customers
  unit: count
  purpose: Retention problems by count; read with the churn reasons.
  formula: Customers with revenue last month and none this month. Mid-month churn shows the month after.
  grain: month
  source_model: fct_mrr_bridge_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: Measured from revenue; a customer that pauses for a month counts as churned, then reactivated.
  numerator: Customers with revenue last month and none this month
  denominator: n/a
  inclusions: All segments
  exclusions: None
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: lower
    amber: 2
    red: 4
  recon_checks: []
  decision_amber: Review each churn reason
  decision_red: Retention program; executive sponsor for top accounts
- name: logo_churn_rate
  label: Logo churn rate
  unit: ratio
  purpose: Share of paying customers lost each month; drives retention priorities.
  formula: Churned customers ÷ customers with revenue last month.
  grain: month
  source_model: fct_mrr_bridge_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: Dominated by self-serve; read alongside gross MRR churn.
  numerator: churned_customers
  denominator: active customers last month
  inclusions: As the formula
  exclusions: None
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: lower
    amber: 0.03
    red: 0.05
  recon_checks: []
  decision_amber: Review churn reasons by segment
  decision_red: Retention program for the worst segment
- name: gross_mrr_churn_rate
  label: Gross MRR churn rate
  unit: ratio
  purpose: Revenue lost from existing customers each month, before expansion.
  formula: −(contraction MRR + churned MRR) ÷ opening MRR.
  grain: month
  source_model: fct_mrr_bridge_monthly
  owner: VP Finance
  status: MEASURED
  tolerance: Usage noise makes every month show some contraction; trend matters more than level.
  numerator: Revenue lost from churned customers
  denominator: Opening MRR
  inclusions: As the formula
  exclusions: Contraction
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: lower
    amber: 0.02
    red: 0.04
  recon_checks:
  - gl_revenue_vs_rated_usage
  decision_amber: Review revenue lost to contraction and churn
  decision_red: Save plan for the largest losses
- name: dso_days
  label: DSO
  unit: days
  purpose: How fast customers pay; cash planning and collections staffing.
  formula: Ending AR ÷ invoiced sales in the month × days in the month.
  grain: month
  source_model: fct_ar_monthly
  owner: Controller
  status: MEASURED
  tolerance: AR subledger must equal the GL control account (assert_ar_ties_to_gl). Month-end billing makes it swing.
  numerator: Ending AR
  denominator: Invoiced sales in the month x days in the month
  inclusions: Usage and project invoices
  exclusions: None
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: lower
    amber: 50
    red: 65
  recon_checks:
  - stripe_invoices_vs_gl_revenue
  decision_amber: Collections push on the oldest invoices
  decision_red: Tighten terms; escalate top overdue accounts to the CFO
- name: cei
  label: Collection effectiveness index
  unit: ratio
  purpose: Collections team performance, independent of sales volume.
  formula: (Beginning AR + sales − ending AR) ÷ (beginning AR + sales − ending current AR).
  grain: month
  source_model: fct_ar_monthly
  owner: Controller
  status: MEASURED
  tolerance: 1.0 means everything collectible was collected.
  numerator: Beginning AR + sales - ending AR
  denominator: Beginning AR + sales - ending current AR
  inclusions: As the formula
  exclusions: None
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: higher
    amber: 0.85
    red: 0.75
  recon_checks: []
  decision_amber: Review the collections queue
  decision_red: Add collections capacity or change terms
- name: ar_over_60
  label: AR over 60 days
  unit: usd
  purpose: Bad-debt risk and write-off candidates.
  formula: Open invoice balances more than 60 days past due at month end.
  grain: month
  source_model: fct_ar_aging_snapshot
  owner: Controller
  status: MEASURED
  tolerance: Includes failed-payment self-serve balances that should be reviewed for write-off.
  numerator: Open invoice balances more than 60 days past due
  denominator: n/a
  inclusions: As the formula
  exclusions: Disputed invoices are included and flagged
  currency_treatment: USD as booked. Foreign-currency invoices are converted at the invoice date's rate; currency moves on collection go to realized
    FX, not this metric.
  period_logic: Closed months only; a month closes when it is billed on the 1st of the next month.
  refresh: Daily (morning run); final at month close
  version: 1
  effective_from: '2025-01-01'
  restatement_policy: Closed months are not restated; corrections post in the open month and are disclosed in the board pack
  threshold:
    basis: value
    better: lower
    amber: 25000
