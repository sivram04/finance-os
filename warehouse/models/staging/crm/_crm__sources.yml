version: 2

sources:
  - name: crm
    schema: "{{ var('dataset_prefix', '') }}raw_crm"
    description: Sales-led opportunities as a CRM export shows them (generator/events/pipeline.py).
    loaded_at_field: _loaded_at
    tables:
      - name: opportunities
      - name: customer_contracts
        description: Committed-use customer contracts (order forms) from the contract-management export (generator/events/contracts.py).
      - name: customer_contract_schedule
        description: Commitment by contract year (ramps step up each year).
