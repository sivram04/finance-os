# Assistant eval (design §9.3, FR-11.5). Expected values are SQL evaluated at run time against the warehouse,
# so the eval stays correct when the data is regenerated. M = the latest month with data.
# Checks per question:
#   expect_values: every value must appear in the answer (any rounding/scale the validator accepts)
#   expect_text:   every regex must match the answer (case-insensitive)
#   expect_refusal: the answer declines and calls no tools
#   expect_proposal: a pending action of this kind is created (and nothing is executed)
#   expect_tools:  each tool must have been called (the right source, not a lucky number); "a|b" = either one
# Every answer is also checked for unverified numbers (numbers no tool returned).

questions:
  - id: kpi-runway
    persona: VP Finance
    ask: What's our runway right now?
    expect_values: ["select value from marts.fct_kpi_monthly where metric_name='runway_months' and month=M"]
  - id: kpi-arr
    persona: VP Finance
    ask: What is ARR?
    expect_values: ["select value from marts.fct_kpi_monthly where metric_name='arr' and month=M"]
  - id: kpi-net-burn
    persona: VP Finance
    ask: How much did we burn last month, net?
    expect_values: ["select value from marts.fct_kpi_monthly where metric_name='net_burn' and month=M"]
  - id: kpi-cash
    persona: VP Finance
    ask: How much cash do we have?
    expect_values: ["select value from marts.fct_kpi_monthly where metric_name='closing_cash' and month=M"]
  - id: kpi-gm
    persona: VP Finance
    ask: What's our gross margin percentage this month?
    expect_values: ["select value from marts.fct_kpi_monthly where metric_name='gross_margin_pct' and month=M"]
  - id: kpi-dso
    persona: Controller
    ask: What's DSO?
    expect_values: ["select value from marts.fct_kpi_monthly where metric_name='dso_days' and month=M"]
  - id: kpi-cei
    persona: Controller
    ask: How effective were collections this month (CEI)?
    expect_values: ["select value from marts.fct_kpi_monthly where metric_name='cei' and month=M"]
  - id: kpi-nrr
    persona: VP Finance
    ask: What's net revenue retention?
    expect_values: ["select value from marts.fct_kpi_monthly where metric_name='nrr' and month=M"]
  - id: kpi-logo-churn
    persona: VP Finance
    ask: What was logo churn this month?
    expect_values: ["select value from marts.fct_kpi_monthly where metric_name='logo_churn_rate' and month=M"]
  - id: kpi-headcount
    persona: VP Finance
    ask: How many employees do we have?
    expect_values: ["select value from marts.fct_kpi_monthly where metric_name='headcount' and month=M"]
  - id: ue-lowest-margin
    persona: VP Finance
    ask: Which customer has the lowest gross margin this month, and what is it?
    expect_text: ["select customer_id from marts.fct_customer_margin_monthly where month=M order by margin_rank_asc limit 1"]
    expect_values: ["select gross_margin_pct from marts.fct_customer_margin_monthly where month=M order by margin_rank_asc limit 1"]
  - id: proj-p103-overrun
    persona: Project Manager
    ask: How far over budget is P-103 expected to finish?
    expect_values: ["select variance_at_completion from marts.fct_project_financials where project_id='P-103' and month=M"]
  - id: proj-federal-funding
    persona: Project Manager
    ask: How much of its funding has the federal contract used?
    expect_values: ["select funding_used_pct from marts.fct_contract_funding where contract_id='C-105' and clin_id='TOTAL' and month=M"]
  - id: proj-p102-cap
    persona: Project Manager
    ask: How close is P-102 to its T&M cap?
    expect_values: ["select cap_used_pct from marts.fct_project_financials where project_id='P-102' and month=M"]
  - id: proj-p106-unbilled
    persona: Billing specialist
    ask: How much unbilled work is sitting on P-106?
    expect_values: ["select unbilled from marts.fct_project_financials where project_id='P-106' and month=M"]
  - id: bill-wrong-rate
    persona: Billing specialist
    ask: Did we bill any invoice line at the wrong rate?
    expect_text: ["select invoice_id from marts.fct_billing_exceptions where exception_type='rate_mismatch' limit 1"]
  - id: spend-tagging
    persona: Head of Infra
    ask: What share of our cloud and GPU spend is tagged this month?
    expect_values: ["select tagging_coverage_pct from marts.fct_tagging_coverage_monthly where month=M"]
  - id: spend-nimbus
    persona: Head of Infra
    ask: How much did we spend with Nimbus this month?
    expect_values: ["select sum(cost) from marts.fct_tech_spend_daily where vendor_id='nimbus' and spend_month=M"]
  - id: spend-renewal
    persona: Head of Infra
    ask: Is any vendor contract coming up for renewal?
    expect_text: ["'Nimbus'"]
  - id: bva-legal-april
    persona: VP Finance
    ask: How much over budget was G&A professional fees in April 2026, and why?
    expect_values: ["select variance from marts.fct_bva_monthly where month=date '2026-04-01' and department_id='GA' and account_id='6400'"]
    expect_text: ["'counsel|dispute|legal'"]
  - id: bva-revenue-forecast
    persona: VP Finance
    ask: Where will usage revenue land for the full year versus budget?
    expect_values: ["select fy_forecast_variance from marts.fct_bva_monthly where month=M and account_id='4000'"]
  - id: ar-over-60
    persona: Controller
    ask: How much AR is more than 60 days past due?
    expect_values: ["select value from marts.fct_kpi_monthly where metric_name='ar_over_60' and month=M"]
  - id: ar-late-payer
    persona: Controller
    ask: Do we have any customers who consistently pay late?
    expect_text: ["select customer_id from marts.fct_customer_payment_behavior where is_chronic_late limit 1"]
  - id: ar-misapplied
    persona: Controller
    ask: Are there any cash application problems I should know about?
    expect_text: ["select customer_id from marts.fct_cash_application_exceptions limit 1"]
  - id: ap-review-count
    persona: AP specialist
    ask: How many vendor bills are waiting for review, and why?
    expect_text: ["select '\\b' || count(distinct doc_file) || ' (?:vendor )?(?:bills|documents|invoices)' from marts.fct_ap_review_queue", "'duplicate'"]
  - id: rev-en003
    persona: VP Finance
    ask: What happened to EN-003's revenue this year?
    expect_text: ["'churn'"]
  - id: rev-new-mrr
    persona: VP Finance
    ask: How much new MRR did we add this month?
    expect_values: ["select new_mrr from marts.fct_mrr_bridge_monthly where month=M"]
  - id: recon-status
    persona: Controller
    ask: Are all our reconciliations passing?
    expect_text: ["'pass'"]
  - id: refuse-invest
    persona: VP Finance
    ask: Should we put our cash into Nvidia stock?
    expect_refusal: true
  - id: propose-reject-duplicate
    persona: AP specialist
    ask: Reject the duplicate FedSec bill FSP-2026-0007_copy2.pdf, it was sent twice.
    expect_proposal: ap_reject
  - id: propose-cash-fix
    persona: Controller
    ask: EN-001's June payment was applied to the wrong invoice. Prepare the fix.
    expect_proposal: cash_application_fix

  # ---- FP&A, treasury, close, pricing, capital, tax (M17-M24) -------------------------------------------
  - id: fpa-base-runway
    persona: VP Finance
    ask: In the base forecast, how many months of runway do we have?
    expect_text: ["'5 years|60|never|not run out|does not run out|doesn.t run out'"]
    expect_tools: [get_forecast]
  - id: fpa-upside-revenue
    persona: VP Finance
    ask: What revenue do we forecast over the next 12 months in the upside scenario?
    expect_tools: [get_forecast]
  - id: fpa-forecast-bias
    persona: FP&A analyst
    ask: How biased have our one-month-ahead revenue forecasts been?
    expect_values: ["select avg(error_pct) from marts.fct_forecast_accuracy where line='revenue' and months_ahead=1"]
    expect_tools: [get_forecast_accuracy]
  - id: fpa-hires
    persona: VP Finance
    ask: How many hires are in the base-case hiring plan?
    expect_values: ["select count(*) from intermediate.int_planned_hires where scenario='base'"]
    expect_tools: [get_headcount_plan]
  - id: fpa-budget-gap
    persona: FP&A analyst
    ask: In total, how far over the board's opex ceiling are next year's department budget requests?
    expect_values: ["select sum(gap) from marts.fct_budget_build where line='opex'"]
    expect_tools: [get_budget_build]
  - id: treasury-low-point
    persona: VP Finance
    ask: What's the lowest our cash gets in the 13-week forecast?
    expect_values: ["select min(closing_cash) from marts.fct_cash_forecast_13w"]
    expect_tools: [get_cash_forecast]
  - id: treasury-covenants
    persona: VP Finance
    ask: Are we breaching any covenants or treasury policies?
    expect_text: ["'MIN-CASH|minimum|[$]3M|[$]3,000,000'"]
    expect_tools: [get_cash_forecast]
  - id: treasury-payment-run
    persona: Controller
    ask: How much will the next vendor payment run pay out?
    expect_values: ["select sum(amount_to_pay) from marts.fct_payment_run_proposal where payment_run_date = (select min(payment_run_date) from marts.fct_payment_run_proposal)"]
    expect_tools: [get_payment_runs]
  - id: wc-ccc
    persona: Controller
    ask: What's our cash conversion cycle?
    expect_values: ["select cash_conversion_cycle_days from marts.fct_working_capital_monthly order by month desc limit 1"]
    expect_tools: [get_working_capital]
  - id: revrec-adjustment
    persona: Controller
    ask: What ASC 606 revenue adjustment do we need to book for the latest closed month?
    expect_values: ["select revenue_adjustment from marts.fct_revenue_rollforward_monthly where month=M"]
    expect_tools: [get_revenue_recognition]
  - id: close-blocker
    persona: Controller
    ask: What's blocking sign-off of the month-end close?
    expect_text: ["'budget|BvA|variance'"]
    expect_tools: ["get_close_status|get_close_dashboard"]
  - id: pricing-stream
    persona: VP Finance
    ask: What would raising streaming prices by 8% do to gross margin over a year?
    expect_values: ["select delta_gross_margin from marts.fct_price_simulation where scenario='stream_plus_8'"]
    expect_tools: [get_pricing_analysis]
  - id: capital-price
    persona: CEO
    ask: What price per share does the base-case Series B imply, and what do founders own afterwards?
    expect_values: ["select price_per_share from marts.fct_fundraise_scenarios where scenario='base'",
                    "select founders_pct_after from marts.fct_fundraise_scenarios where scenario='base'"]
    expect_tools: [get_cap_table_and_fundraise]
  - id: tax-collected
    persona: Controller
    ask: How much sales tax, VAT and GST have we collected in total?
    expect_values: ["select sum(tax_collected_usd) from marts.fct_tax_fx_monthly"]
    expect_tools: [get_tax_and_fx]
  - id: allocation-eng
    persona: FP&A analyst
    ask: How much of this month's shared rent was allocated to Engineering?
    expect_values: ["select allocated_amount from marts.fct_shared_cost_allocation_monthly where pool='facilities' and department_id='ENG' and month=M"]
    expect_tools: [get_shared_cost_allocation]

  # ---- deal desk, commissions (M9, M10) ------------------------------------------------------------------
  - id: deal-price-check
    persona: Sales
    ask: Price a deal for Acme at 40,000 batch_pro hours a month, 15% off, 24 months, with a $10,000 monthly commit. Does it auto-approve?
    expect_text: ["'auto|approv'"]
    expect_tools: [price_deal]
  - id: deal-submit-over-guardrail
    persona: Sales
    ask: Submit a deal for Beta Corp, 5,000 stream hours a month at 30% off for 12 months with no commit.
    expect_proposal: deal_approval
  - id: comp-top-rep
    persona: VP Sales
    ask: What is AE-01's quota attainment year to date?
    expect_values: ["select quota_attainment_pct from marts.fct_commission_statement_monthly where rep_id='AE-01' and month=M"]
    expect_tools: ["get_commissions|get_commissions_dashboard"]
  - id: comp-dispute
    persona: Sales
    ask: AE-02 disputes their September 2026 statement for MM-003 — they think the expansion was undercounted. Log it.
    expect_proposal: commission_dispute
  - id: fpa-ltv-cac
    persona: CFO
    ask: What is our LTV to CAC ratio and CAC payback right now?
    expect_values: ["select ltv_to_cac from marts.fct_saas_metrics_monthly where month=M",
                    "select cac_payback_months from marts.fct_saas_metrics_monthly where month=M"]
    expect_tools: [get_saas_metrics]
  - id: fpa-rule-of-40
    persona: CFO
    ask: Do we pass the Rule of 40?
    expect_values: ["select rule_of_40 from marts.fct_saas_metrics_monthly where month=M"]
    expect_tools: ["get_saas_metrics|get_kpis|get_kpi_trend"]
  - id: fpa-breakeven
    persona: CFO
    ask: What monthly revenue do we need to break even?
    expect_values: ["select breakeven_revenue from marts.fct_cost_behavior_monthly where month=M"]
    expect_tools: [get_cost_behavior]
  - id: fpa-pvm
    persona: FP&A
    ask: Break last month's usage revenue change into price, volume and mix.
    expect_tools: [get_revenue_pvm]
  - id: fpa-lrp
    persona: CFO
    ask: In the five-year plan, which year do we turn EBITDA positive?
    expect_values: ["select ebitda from marts.fct_long_range_plan where year = (select min(year) from marts.fct_long_range_plan where ebitda > 0)"]
    expect_tools: [get_long_range_plan]
  - id: fpa-campaign
    persona: CMO
    ask: Marketing wants $500K for a campaign that should bring 40 new customers. Is it worth it?
    expect_tools: [evaluate_marketing_campaign]
  - id: fpa-statements
    persona: Controller
    ask: Show me the balance sheet for the last 3 months. Does it balance?
    expect_tools: [get_financial_statements]
  - id: exec-how-are-we-doing
    persona: CEO
    ask: How are we doing this month compared to last month and budget?
    expect_tools: [get_kpi_scorecard]
  - id: exec-what-changed
    persona: CFO
    ask: What changed this month and why?
    expect_tools: [get_month_summary]
  - id: growth-burn-multiple
    persona: Board member
    ask: What is our burn multiple?
    expect_values: ["select burn_multiple from marts.fct_growth_efficiency_monthly where month=M"]
    expect_tools: ["get_growth_efficiency|get_kpis|get_kpi_trend"]
  - id: growth-concentration
    persona: Investor
    ask: How concentrated is our revenue? What share do the top 10 customers have?
    expect_values: ["select sum(revenue_share) from marts.fct_customer_health where revenue_rank <= 10"]
    expect_tools: [get_customer_health]
  - id: growth-at-risk
    persona: VP Customer Success
    ask: Which customers are at risk of churning, and why?
    expect_text: ["'EN-002'"]
    expect_tools: [get_customer_health]
  - id: growth-cohorts
    persona: CFO
    ask: Are newer customer cohorts retaining revenue better or worse than older ones?
    expect_tools: [get_cohort_retention]
  - id: pipeline-coverage
    persona: VP Sales
    ask: Do we have enough pipeline to hit next quarter's number?
    expect_tools: [get_pipeline]
    expect_text: ["'coverage|[0-9.]+x'"]
  - id: stress-downturn
    persona: CFO
    ask: What happens to cash and EBITDA if sales cycles lengthen by 30 days and NRR drops 5 points?
    expect_tools: [run_stress_test]
  - id: stress-price-cut
    persona: CEO
    ask: If we cut prices 10% to fight a competitor, how much ARR do we have in 12 months?
    expect_tools: [run_stress_test]
  - id: segment-emea
    persona: Board member
    ask: Is EMEA profitable for us?
    expect_tools: [get_segment_pnl]
  - id: entity-consolidation
    persona: Controller
    ask: How much did the UK and India subsidiaries charge the parent this month, and do intercompany balances eliminate?
    expect_tools: [get_consolidation]
  - id: burdened-cac
    persona: Investor
    ask: What is our fully burdened CAC and LTV to CAC?
    expect_values: ["select ltv_to_cac_burdened from marts.fct_saas_metrics_monthly where month=M"]
    expect_tools: ["get_saas_metrics|get_kpis|get_kpi_trend"]
  - id: treasury-sweep
    persona: VP Finance
    ask: How much interest do our cash sweeps earn over the next quarter?
    expect_tools: [get_treasury_sweep]
  - id: payment-prediction
    persona: Controller
    ask: When do we expect EN-001 to pay its September invoice?
    expect_tools: ["get_receivables_dashboard|get_customer_detail"]
  - id: rpo-crpo
    persona: Investor
    ask: What is our RPO and current RPO, and how does contracted ARR compare to run-rate ARR?
    expect_tools: ["get_contracts|get_kpi_trend"]
  - id: renewal-risk
    persona: CRO
    ask: Which contracts renewing in the next six months are burning below their commitment?
    expect_tools: [get_contracts]
  - id: forecast-vs-last-close
    persona: CFO
    ask: How did our forecast change since last month's close, and why?
    expect_tools: [get_forecast_changes]
  - id: workforce-risk
    persona: VP People
    ask: What will people cost us next year once you account for attrition, hiring slippage and merit increases?
    expect_tools: [get_headcount_plan]
  - id: deferred-commissions
    persona: Controller
    ask: What is our deferred commissions balance under ASC 340-40?
    expect_tools: [get_commissions_dashboard]
  - id: ceo-focus
    persona: CEO
    ask: What are the five biggest risks and opportunities I should focus on?
    expect_tools: [get_ceo_one_pager]
  - id: ebitda-drivers
    persona: CFO
    ask: Which operating drivers moved EBITDA this month?
    expect_tools: ["get_driver_tree|get_driver_bridges"]
  - id: gpu-idle
    persona: VP Engineering
    ask: How much of our GPU time is idle, and how well do our commitments cover usage?
    expect_tools: [get_gpu_efficiency]
  - id: procurement-savings
    persona: CFO
    ask: How much has procurement saved us this year?
    expect_tools: [get_procurement]
  - id: deal-credit-risk
    persona: Deal desk
    ask: Price 40,000 streaming hours a month at a 15% discount for EN-002 - what is the credit exposure and commission cost?
    expect_tools: [price_deal]
  - id: metric-contract
    persona: Auditor
    ask: How is run-rate ARR defined, what version is it, and when did it last change?
    expect_tools: [get_metric_definition]
