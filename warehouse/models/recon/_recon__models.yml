version: 2

models:
  - name: recon_vendor_invoices
    description: "Grain: vendor × service month. Vendor invoice vs. modeled cost, 1% tolerance (design §8 M3)."
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments: {columns: [vendor_id, period]}

  - name: recon_vendor_bills_gl
    description: "Grain: vendor invoice. Invoice total vs. AP credit posted in the GL."

  - name: recon_gl_revenue
    description: "Grain: month. GL usage revenue vs. rated usage (stand-in for Stripe ↔ GL)."

  - name: recon_payroll_gl
    description: "Grain: month. Payroll register vs. GL payroll accounts (FR-12.5)."

  - name: recon_project_billing_gl
    description: "Grain: month. Project invoices vs. GL services revenue (4100)."

  - name: recon_project_labor
    description: "Grain: employee × month. Timesheet labor cost must not exceed payroll cost."

  - name: recon_usage_events
    description: "Grain: month. Billable audio from deduplicated request events vs. the daily usage drivers, to the ms."

  - name: recon_stripe_revenue_gl
    description: "Grain: month. Stripe usage invoices vs. GL usage revenue (FR-12.1)."

  - name: recon_stripe_cash_gl
    description: "Grain: month. Stripe charges net of fees and refunds vs. GL cash for usage billing (FR-12.2)."

  - name: recon_status
    description: "Grain: check × period × entity. Every reconciliation in one table (FR-12.6)."
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments: {columns: [check_name, period, entity_id]}
    columns:
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: [pass]}
