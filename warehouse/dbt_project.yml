name: finance_os
version: "0.1.0"
config-version: 2
profile: finance_os

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

vars:
  allocation_scenario: base   # row set in seeds/allocation_rules.csv (FR-2.4)
  ap_backend: text            # which AP extraction run the warehouse reads: text (rules) or openai

seeds:
  finance_os:
    +schema: seeds
    gpu_rates:
      +column_types: {effective_from: date, effective_to: date, rate_per_gpu_hour: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}"}
    vendor_contracts:
      +column_types: {start_date: date, end_date: date, committed_gpu_hours_month: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}", renewal_notice_days: integer}
    gl_accounts:
      +column_types: {account_id: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"}
    metric_benchmarks:
      +column_types: {good: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}", median: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}"}
    entities:
      +column_types: {markup_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    entity_assignment:
      +column_types: {share: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    sales_capacity_policy:
      +column_types: {value: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"}
    cost_behavior:
      +column_types: {account_id: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}", variable_share: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    lrp_assumptions:
      +column_types: {revenue_growth: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", gross_margin_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", sm_pct_revenue: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", rd_pct_revenue: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", ga_pct_revenue: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", capex_pct_revenue: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    variance_thresholds:
      +column_types: {min_variance_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(6,4)' }}", min_variance_abs: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}"}
    labor_cost_policy:
      +column_types: {employer_tax_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(6,4)' }}", benefits_per_month: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}", standard_hours_year: integer}
    project_alert_rules:
      +column_types: {threshold_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(6,4)' }}"}
    billing_rules:
      +column_types: {threshold_days: integer}
    ar_policy:
      +column_types: {payment_terms_days: integer, collection_weight: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(6,2)' }}", min_chase_amount: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}"}
    collection_tiers:
      +column_types: {tier: integer, min_days_overdue: integer, max_days_overdue: integer}
    margin_floors:
      +column_types: {gross_margin_floor_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(5,4)' }}"}
    comp_plans:
      +column_types: {annual_quota_arr: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}", base_rate: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}", accelerator_rate: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}", expansion_multiplier: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}", effective_from: date, effective_to: date}
    credit_splits:
      +column_types: {split_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}"}
    spiffs:
      +column_types: {amount_per_credit: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}", start_month: date, end_month: date}
    workforce_policy:
      +column_types: {attrition_benchmark: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", recruiting_fee_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", equipment_per_hire: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}", merit_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", promotion_rate: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", promotion_uplift_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", equity_grant_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", equity_employer_tax_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    hire_probability:
      +column_types: {probability: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", slip_months: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,2)' }}"}
    scenario_levers:
      +column_types: {value: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    planning_scenarios:
      +column_types: {value: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    planning_targets:
      +column_types: {value: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}"}
    hiring_plan:
      +column_types: {annual_salary: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}", planned_start: date}
    shared_cost_allocation:
      +column_types: {account_id: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}"}
    treasury_accounts:
      +column_types: {target_share: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", annual_yield: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    treasury_policy:
      +column_types: {threshold: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}"}
    vendor_payment_terms:
      +column_types: {payment_terms_days: integer, early_pay_discount_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", discount_days: integer}
    prepaid_contracts:
      +column_types: {account_id: "{{ 'string' if target.type == 'bigquery' else 'varchar' }}", start_month: date, months: integer, amount: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}"}
    price_scenarios:
      +column_types: {price_change_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", volume_elasticity: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    discount_policy:
      +column_types: {max_discount_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    cap_table:
      +column_types: {shares: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}", price_per_share: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}", invested: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}", issue_date: date}
    fundraise_scenarios:
      +column_types: {pre_money: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}", raise_amount: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}", option_pool_target_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", close_month: date}
    customer_billing_profile:
      +column_types: {tax_rate: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    deal_guardrails:
      +column_types: {max_discount_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}"}
    deal_policy:
      +column_types: {value: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,4)' }}"}
    sales_reps:
      +column_types: {annual_quota_arr: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}", base_rate: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", accelerator_rate: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(9,4)' }}", clawback_days: integer}
    fx_rates:
      +column_types: {month: date, usd_per_unit: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,6)' }}"}
    payment_fee_schedule:
      +column_types: {fee_pct: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(6,4)' }}", fee_fixed: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}", fee_cap: "{{ 'numeric' if target.type == 'bigquery' else 'decimal(18,2)' }}"}

models:
  finance_os:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    recon:
      +materialized: table
      +schema: recon
