name: finance_os
version: "0.1.0"
config-version: 2
profile: finance_os

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
snapshot-paths: ["snapshots"]

vars:
  allocation_scenario: base   # row set in seeds/allocation_rules.csv (FR-2.4)

seeds:
  finance_os:
    +schema: seeds
    gpu_rates:
      +column_types: {effective_from: date, effective_to: date, rate_per_gpu_hour: "decimal(18,4)"}
    vendor_contracts:
      +column_types: {start_date: date, end_date: date, committed_gpu_hours_month: "decimal(18,4)", renewal_notice_days: integer}
    gl_accounts:
      +column_types: {account_id: varchar}
    margin_floors:
      +column_types: {gross_margin_floor_pct: "decimal(5,4)"}
    payment_fee_schedule:
      +column_types: {fee_pct: "decimal(6,4)", fee_fixed: "decimal(18,2)", fee_cap: "decimal(18,2)"}

models:
  finance_os:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    recon:
      +materialized: table
      +schema: recon
