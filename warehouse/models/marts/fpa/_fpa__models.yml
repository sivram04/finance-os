version: 2

models:
  - name: fct_saas_metrics_monthly
    description: SaaS unit economics per closed month (CAC, ARPA, LTV, LTV:CAC, CAC payback, Rule of 40, free cash flow).
    columns:
      - name: month
        data_tests: [unique, not_null]

  - name: fct_cost_behavior_monthly
    description: Fixed vs variable costs (seeds/cost_behavior.csv), contribution margin, breakeven and operating leverage.
    columns:
      - name: month
        data_tests: [unique, not_null]
      - name: revenue
        data_tests: [not_null]

  - name: fct_revenue_pvm_monthly
    description: Month-over-month price / volume / mix bridge of usage revenue by product; the three effects sum to the change.
    columns:
      - name: product_id
        data_tests: [not_null]

  - name: fct_long_range_plan
    description: Five-year plan from the trailing twelve closed months and seeds/lrp_assumptions.csv, with the base-case raise.
    columns:
      - name: year
        data_tests: [unique, not_null]

  - name: fct_growth_efficiency_monthly
    description: ARR waterfall (new, expansion, reactivation, contraction, churn), net new ARR, quick ratio and burn multiple.
    columns:
      - name: month
        data_tests: [unique, not_null]

  - name: fct_cohort_retention
    description: Logo and revenue retention by first-revenue-month cohort and months since.
    columns:
      - name: cohort_month
        data_tests: [not_null]

  - name: fct_customer_health
    description: Customer health from usage trend, overdue invoices, disputes and margin; revenue share for concentration.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: health
        data_tests:
          - accepted_values:
              arguments: {values: [healthy, watch, at_risk]}

  - name: fct_pipeline
    description: Open sales pipeline with weighted ARR, close quarter, slipped flag and age vs the won sales cycle.
    columns:
      - name: opportunity_id
        data_tests: [unique, not_null]

  - name: fct_bookings_monthly
    description: Won ARR, lost ARR, win rate (trailing 6 months) and sales cycle by month and segment.

  - name: fct_sales_capacity_monthly
    description: Ramp-adjusted sales capacity (AEs on payroll plus planned hires) vs actual bookings, 12 months back and ahead.
    columns:
      - name: month
        data_tests: [unique, not_null]

  - name: dim_customer_geo
    description: Customer country, region group and sales channel for segment reporting.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: fct_segment_pnl_monthly
    description: Segment P&L by region and by channel per closed month, with contribution margin and allocated opex.

  - name: dim_entity
    description: Legal entities (seeds/entities.csv).
    columns:
      - name: entity_id
        data_tests: [unique, not_null]

  - name: fct_gl_entity_monthly
    description: Each legal entity's ledger by month, in USD and in its functional currency.

  - name: fct_consolidation_monthly
    description: Entity balances (P&L for the month, balance sheet cumulative and translated at closing rates), CTA, and intercompany eliminations; entities plus ELIM sum to the consolidated ledger.

  - name: fct_cloud_cost_bridge_monthly
    description: Cloud and GPU cost change by cause (demand, efficiency, rate, shared, commitment, other cloud), by product and in total.

  - name: fct_margin_burn_bridge_monthly
    description: Gross margin and net burn bridges, month over month; steps add up exactly to the change.

  - name: fct_headcount_bridge
    description: Headcount bridge by department (opening, hires, leavers, closing) against the base hiring plan.

  - name: fct_metric_values_monthly
    description: The governed metric layer, every catalogued metric value by month from whichever mart computes it.

  - name: fct_efficiency_quarterly
    description: Magic number on a trailing-quarter basis.

  - name: fct_gpu_efficiency_monthly
    description: GPU idle share, commitment coverage and utilization by GPU type.

  - name: fct_cost_anomalies
    description: Daily cloud and GPU cost anomalies (3 sigma and 500 USD vs the trailing 28 days) by vendor and service.

  - name: fct_contract_revenue_monthly
    description: >
      Committed-use customer contracts by contract x closed month: current-year commitment, usage consumed against it,
      RPO and current RPO, contracted ARR, burn pace, projected shortfall (true-up or expiring credits) and overage,
      and days to renewal.
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments: {columns: [month, contract_id]}
    columns:
      - name: billing_model
        data_tests:
          - accepted_values:
              arguments: {values: [commit_overage, prepaid_credits]}

  - name: fct_vendor_commitments
    description: Remaining purchase commitments on vendor contracts.

  - name: fct_procurement_savings_monthly
    description: Negotiated rate savings and early-payment discounts by month.
