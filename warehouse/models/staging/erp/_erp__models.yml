version: 2

models:

  - name: stg_erp__vendor_bills
    description: "Grain: one row per vendor invoice (one per vendor per service month)."
    columns:
      - name: bill_id
        data_tests: [unique, not_null]
      - name: vendor_id
        data_tests:
          - relationships:
              arguments: {to: ref('vendor_contracts'), field: vendor_id}
              config: {severity: warn}   # bills from vendors without a contract (one-offs, new vendors) are flagged, not fatal

  - name: stg_erp__vendor_bill_lines
    description: "Grain: one row per invoice line."
    columns:
      - name: bill_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_erp__vendor_bills'), field: bill_id}
      - name: line_type
        data_tests:
          - accepted_values:
              arguments: {values: [gpu_usage, commit_shortfall, cloud_services, services]}

  - name: stg_erp__journal_entries
    description: "Grain: one row per journal entry."
    columns:
      - name: entry_id
        data_tests: [unique, not_null]
      - name: entry_type
        data_tests:
          - accepted_values:
              arguments: {values: [revenue, collection, payment_fee, vendor_bill, vendor_payment, payroll, opex, one_off, funding, refund, project_invoice, project_collection, subcontractor_bill, subcontractor_payment, project_odc, payroll_remittance]}

  - name: stg_erp__journal_lines
    description: "Grain: one row per journal line. amount = debit − credit."
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments: {columns: [entry_id, line_no]}
    columns:
      - name: entry_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_erp__journal_entries'), field: entry_id}
      - name: account_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('gl_accounts'), field: account_id}
      - name: department_id
        data_tests:
          - relationships:
              arguments: {to: ref('departments'), field: department_id}

  - name: stg_erp__budgets
    description: "Grain: fiscal year × month × department × account × version. Amounts in natural sign (revenue positive)."
    data_tests:
      - dbt_utils_free_unique_combination:
          arguments: {columns: [version, month, department_id, account_id]}
    columns:
      - name: account_id
        data_tests:
          - relationships:
              arguments: {to: ref('gl_accounts'), field: account_id}
      - name: department_id
        data_tests:
          - relationships:
              arguments: {to: ref('departments'), field: department_id}

  - name: stg_erp__customer_payments
    description: "Grain: one row per customer payment. remittance_ref = invoice the customer paid; applied_ref = where AR applied it."
    columns:
      - name: payment_id
        data_tests: [unique, not_null]

  - name: stg_erp__disputes
    description: "Grain: one row per customer dispute (FR-8.5)."
    columns:
      - name: dispute_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: [open, resolved_credit, resolved_no_change]}
